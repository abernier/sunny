<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunny reel</title>
<!--
	The page the reel is drawn on, 1920x1080. Everything inside #screen is a Mac screen of 1728x972 points
	(one point = 1.111 pixels at zoom 1): an original wallpaper, a drawn menu bar, and the captured windows.
	#view holds the brightness: an SVG filter that raises the exposure of the whole screen, as a gamma
	change after capture would. reel.js moves everything, see renderAt(t).
-->
<style>
	@font-face { font-family: "Bricolage"; src: url("captures/bricolage.woff2") format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; }
	html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
	body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
	#view { position: absolute; inset: 0; overflow: hidden; }
	#screen { position: absolute; left: 0; top: 0; width: 1728px; height: 972px; transform-origin: 0 0; overflow: hidden; }
	.abs { position: absolute; }

	/* An original wallpaper: a dusk gradient with two soft glows. */
	#wall {
		position: absolute; inset: 0;
		background:
			radial-gradient(60% 55% at 78% 88%, rgba(255, 150, 80, 0.55), transparent 70%),
			radial-gradient(50% 60% at 15% 20%, rgba(120, 70, 200, 0.45), transparent 70%),
			linear-gradient(170deg, #1d1033 0%, #3b1450 38%, #7a2453 70%, #c4554a 100%);
	}

	/* A plain menu bar: no logo, no names. */
	#menubar { position: absolute; left: 0; top: 0; width: 1728px; height: 24px; background: rgba(20, 10, 30, 0.32); backdrop-filter: blur(20px) saturate(1.4); color: #fff; font-size: 13px; display: flex; align-items: center; z-index: 50; }
	#menubar .left { display: flex; gap: 20px; padding-left: 20px; font-weight: 500; letter-spacing: 0.01em; }
	#menubar .right { margin-left: auto; display: flex; align-items: center; height: 24px; padding-right: 12px; gap: 4px; }
	#menubar .item { height: 22px; display: flex; align-items: center; padding: 0 7px; border-radius: 5px; gap: 0; }
	#menubar .item.on { background: rgba(255, 255, 255, 0.22); }
	#tray img { width: 18px; height: 18px; filter: invert(1); display: block; }
	#tray-title { font-variant-numeric: tabular-nums; white-space: pre; }
	#clock { font-variant-numeric: tabular-nums; }

	/* The DMG's Finder window, as captured. */
	#dmg { position: absolute; width: 540px; height: 380px; filter: drop-shadow(0 22px 40px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.5)); }
	#dmg > img.win { width: 540px; height: 380px; display: block; }
	/* The volume's background image, laid over the hidden files the capture's Finder shows. */
	#dmg-patch { position: absolute; left: 0; top: 32px; width: 540px; height: 165px; background: url("captures/dmg-background@2x.png") 0 0 / 540px 380px no-repeat; }
	#sel { position: absolute; border-radius: 9px; background: rgba(0, 0, 0, 0.11); opacity: 0; }
	#sel-label { position: absolute; border-radius: 4px; background: #6b6b70; color: #fff; font-size: 13px; padding: 0 5px; line-height: 18px; opacity: 0; transform: translateX(-50%); }
	#apps-hi { position: absolute; border-radius: 9px; background: rgba(0, 0, 0, 0.16); opacity: 0; }
	#ghost { position: absolute; width: 80px; text-align: center; opacity: 0; pointer-events: none; }
	#ghost img { width: 80px; height: 80px; display: block; }
	#ghost span { display: inline-block; margin-top: 3px; font-size: 13px; color: #1d1d1f; }

	/* The browser window: the captured toolbar over the captured page. */
	#chrome { position: absolute; width: 1440px; height: 887px; border-radius: 10px; overflow: hidden; box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.6); }
	#chrome img { display: block; width: 1440px; }
	#chrome .bar { height: 87px; }
	#chrome .page { height: 800px; }

	/* The popover: the system's dark vibrancy under the captured page of the app. */
	#pop { position: absolute; width: 300px; height: 167px; transform-origin: 50% 0; opacity: 0; }
	#pop .material { position: absolute; inset: 0; border-radius: 10px; background: rgba(38, 36, 44, 0.72); backdrop-filter: blur(28px) saturate(1.8); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.6); }
	#pop img { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }

	#cursor { position: absolute; left: 0; top: 0; width: 26px; height: 34px; z-index: 100; transform-origin: 2px 2px; }

	/* The end: the icon builds, the name beside it. */
	#logo { position: absolute; inset: 0; background: radial-gradient(75% 85% at 50% 45%, #2c0c3b 0%, #170620 55%, #0b0310 100%); opacity: 0; display: flex; align-items: center; justify-content: center; }
	#logo .row { display: flex; align-items: center; gap: 40px; transform: translateX(-10px); }
	#logo svg { width: 330px; height: 330px; overflow: visible; }
	#word { font-family: "Bricolage", sans-serif; font-weight: 650; font-stretch: 82%; font-size: 176px; letter-spacing: -0.02em; color: #fff4e6; line-height: 1; }
	#brew { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 22px; color: rgba(255, 238, 220, 0.55); opacity: 0; letter-spacing: 0.01em; }
	#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
	<!-- The boost: each channel through a tone curve (exposure in linear light, highlights rolled off), and a bloom of what is near white. -->
	<filter id="expose" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
		<feComponentTransfer result="tone">
			<feFuncR id="fr" type="table" tableValues="0 1"/>
			<feFuncG id="fg" type="table" tableValues="0 1"/>
			<feFuncB id="fb" type="table" tableValues="0 1"/>
		</feComponentTransfer>
		<feComponentTransfer in="tone" result="hi">
			<feFuncR id="hr" type="table" tableValues="0 0"/>
			<feFuncG id="hg" type="table" tableValues="0 0"/>
			<feFuncB id="hb" type="table" tableValues="0 0"/>
		</feComponentTransfer>
		<feGaussianBlur in="hi" stdDeviation="22" result="glow"/>
		<feComposite id="bloom" in="tone" in2="glow" operator="arithmetic" k1="0" k2="1" k3="0" k4="0"/>
	</filter>
</svg>

<div id="view">
	<div id="screen">
		<div id="wall"></div>
		<div id="menubar">
			<div class="left" id="menus"></div>
			<div class="right">
				<div class="item" id="tray"><img src="captures/MenuBarIconTemplate@2x.png" alt=""><span id="tray-title"></span></div>
				<div class="item"><svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.6a10 10 0 0 1 14 0M4 7.3a6.4 6.4 0 0 1 9 0"/><circle cx="8.5" cy="10.4" r="1.3" fill="#fff" stroke="none"/></svg></div>
				<div class="item"><svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.6" y="0.6" width="22" height="10.8" rx="3" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/><rect x="2.3" y="2.3" width="15.5" height="7.4" rx="1.6" fill="#fff"/><path d="M24 4.2v3.6a1.8 1.8 0 0 0 0-3.6z" fill="rgba(255,255,255,.55)"/></svg></div>
				<div class="item" id="clock">Thu 26 Nov&nbsp;&nbsp;9:41</div>
			</div>
		</div>

		<div id="dmg">
			<img class="win" src="captures/dmg-window.png" alt="">
			<div id="dmg-patch"></div>
			<div id="sel"></div>
			<div id="sel-label">Sunny</div>
			<div id="apps-hi"></div>
		</div>

		<div id="chrome">
			<img class="bar" src="captures/chrome-toolbar.png" alt="">
			<img class="page" src="captures/page.png" alt="">
		</div>

		<div id="pop"><div class="material"></div><div id="pop-frames"></div></div>

		<div id="ghost"><img src="captures/AppIcon.png" alt=""><span>Sunny</span></div>

		<svg id="cursor" viewBox="0 0 26 34">
			<!-- A plain arrow: black, white edge, soft shadow. The tip is the hot spot, at (2, 2). -->
			<defs><filter id="cs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-opacity=".45"/></filter></defs>
			<path filter="url(#cs)" d="M2 2 L2 25.5 L7.6 20.3 L11.4 29.2 L15.4 27.5 L11.7 18.8 L19.2 18.8 Z" fill="#000" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
		</svg>
	</div>
</div>

<div id="logo">
	<div class="row">
		<svg viewBox="80 80 864 864" id="mark">
			<defs>
				<path id="plate" d="M924 512C924 820 820 924 512 924C204 924 100 820 100 512C100 204 204 100 512 100C820 100 924 204 924 512Z"/>
				<filter id="plate-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
				<clipPath id="plate-clip"><use href="#plate"/></clipPath>
				<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#ffe86b"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2e88"/>
				</linearGradient>
				<mask id="bands" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
					<rect width="1024" height="1024" fill="#fff"/>
					<rect id="b1" x="203" y="550.6" width="618" height="41.2" fill="#000"/>
					<rect id="b2" x="203" y="640.75" width="618" height="51.5" fill="#000"/>
					<rect id="b3" x="203" y="738.6" width="618" height="67" fill="#000"/>
				</mask>
			</defs>
			<g id="plate-g" style="transform-origin: 512px 512px">
				<use href="#plate" fill="#2a0b3d" stroke="rgba(255,255,255,.08)" stroke-width="3" filter="url(#plate-shadow)"/>
				<g clip-path="url(#plate-clip)"><g mask="url(#bands)"><circle id="sun-disc" cx="512" cy="512" r="283" fill="url(#sun)"/></g></g>
			</g>
		</svg>
		<div id="word">Sunny</div>
	</div>
	<div id="brew">brew install --cask abernier/tap/sunny</div>
</div>
<div id="flash"></div>

<script src="reel.js"></script>
</body>
</html>
