# Builds Sunny.app (native/, SwiftUI) for Apple silicon and publishes Sunny-arm64.dmg and Sunny-arm64.zip.
# A tag v* makes the GitHub Release of that tag and bumps the cask in abernier/homebrew-tap; the site links to
# https://github.com/abernier/sunny/releases/latest/download/Sunny-arm64.dmg.
# Run by hand, it builds and keeps the files as a workflow artifact only.
# The app is signed ad hoc and not notarised: there are no Apple credentials here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      # A released Xcode, never a beta: the same toolchain the App Store accepts. build.sh reads DEVELOPER_DIR.
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Point DEVELOPER_DIR at it
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build Sunny-arm64.dmg and Sunny-arm64.zip
        env:
          # A tag v1.2.3 gives the app version 1.2.3 (and build number 1.2.3).
          SUNNY_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          export SUNNY_VERSION="${SUNNY_VERSION#v}"
          [ -n "$SUNNY_VERSION" ] || unset SUNNY_VERSION
          scripts/build.sh dist
          test -f build/dist/Sunny-arm64.dmg
          test -f build/dist/Sunny-arm64.zip
          test -x build/dist/Sunny.app/Contents/MacOS/Sunny

      - uses: actions/upload-artifact@v4
        with:
          name: Sunny-arm64
          path: |
            native/build/dist/Sunny-arm64.dmg
            native/build/dist/Sunny-arm64.zip
          if-no-files-found: error

      # A published release is never rebuilt in place: replacing its assets would change
      # their sha256 and break the Homebrew cask that pins it. Tag a new version instead.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; tag a new version instead of replacing its assets."
            exit 1
          fi
          gh release create "$TAG" build/dist/Sunny-arm64.dmg build/dist/Sunny-arm64.zip --title "Sunny $TAG" --generate-notes

      # The cask lives in abernier/homebrew-tap (brew install --cask abernier/tap/sunny).
      # HOMEBREW_TAP_DEPLOY_KEY is a write deploy key of that repository only.
      - name: Bump the Homebrew cask in abernier/homebrew-tap
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          sha=$(shasum -a 256 native/build/dist/Sunny-arm64.dmg | cut -d' ' -f1)
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth=1 git@github.com:abernier/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"${TAG#v}\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/sunny.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sunny $TAG"
          git push origin main
